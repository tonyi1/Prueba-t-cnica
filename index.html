<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header>
        <h1>Mi lista de tareas</h1>
    </header>
    <main>
        <section class="formTareas">
            <form id="formTareas">
                <input type="text" id="entradaTarea" placeholder="Nueva tarea" required>
                <button type="submit">Agregar</button>
            </form>
            <div class="controlTareas">
                <p id="contadorPendientes">Pendientes: 0</p>
                <div class="filtros">
                    <button id="filtroTodos" class="activo">Todos</button>
                    <button id="filtroPendientes">Pendientes</button>
                    <button id="filtroCompletadas">Completados</button>
                </div>
            </div>
            <ul id="listaTareas"></ul>
        </section>
    </main>
    <footer>
        <p>Lista de tareas Hernandez Orozco Antonio Jesus 2026</p>
    </footer>
    <script src="js/app.js"></script>
</body>

</html>
